[Digitizer]
RecordLength = 512
# CH0/CH1 coincidence가 승인될 때 CH0~CH3 파형을 함께 기록합니다.
ChannelMask = 15
# CH2/CH3은 기록 전용이며 discriminator/trigger에는 참여하지 않습니다.
SelfTriggerMask = 3
PostTrigger = 60
InputRangeMv = 2000
ADCBits = 14
TriggerPolarity = 1
ExtTriggerMode = 0
SelfTriggerMode = 1

[HardwareCoincidence]
# CH0/CH1의 threshold comparator 출력이 실제로 겹칠 때만 트리거합니다.
PairLogic = AND

[TriggerCalibration]
# Reset/DCOffset 적용 후 실제 software-trigger waveform으로 채널별 baseline을
# 측정하고, 연속 3회가 2 ADC 이내일 때만 self-trigger threshold를 기록합니다.
SettlingTimeMs = 3000
SettlingTimeoutMs = 15000
MeasurementEvents = 32
StabilityToleranceAdc = 2.0
StableMeasurements = 3

[Synchronization]
ClockSource = 0
RunSyncMode = 0

[SoftwareDSP]
# 오프라인 분석용 시간차이며 위 하드웨어 pair 논리와 별개입니다.
CoincidenceWindow = 20
BaselineSamples = 163
ShortGate = 40
LongGate = 200

[Storage]
# 시작 시 확보할 여유 공간과 수집 중 안전 정지 문턱 (MiB)
MinimumFreeMiB = 1024
StopFreeMiB = 512

[Channel_0]
DCOffset = 6554
TriggerThresholdMv = 1.0

[Channel_1]
DCOffset = 6554
TriggerThresholdMv = 1.0

[Channel_2]
# 기록 전용 채널. 실제 입력에 맞춰 GUI에서 조정할 수 있습니다.
DCOffset = 6554

[Channel_3]
# 기록 전용 채널. 실제 입력에 맞춰 GUI에서 조정할 수 있습니다.
DCOffset = 6554
