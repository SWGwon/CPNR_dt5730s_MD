[Connection]
Type = USB
Link = 0
Node = 0
BaseAddress = 0
# CAEN BoardInfo.ModelName의 prefix를 reset 전에 확인합니다.
ExpectedModel = DT5730
# 여러 동일 모델을 연결할 때는 반드시 실제 값을 활성화하세요.
# ExpectedSerial = 12345

[Digitizer]
# x730 표준 waveform firmware는 RecordLength를 10 Samples 단위로 설정합니다.
# 520 Samples = 1040 ns; PostTrigger=60 readback에서 Pre/Post는 208/312 Samples입니다.
RecordLength = 520
# CH0/CH1 coincidence가 승인될 때 CH0~CH3 파형을 함께 기록합니다.
ChannelMask = 15
# CH2/CH3은 기록 전용이며 discriminator/trigger에는 참여하지 않습니다.
SelfTriggerMask = 3
PostTrigger = 60
InputRangeMv = 2000
ADCBits = 14
TriggerPolarity = 1
ExtTriggerMode = 0
SelfTriggerMode = 1
# GUI의 Software Random 선택 시 이 두 값과 SelfTriggerMask가 자동 조정됩니다.
SoftwareRandomTriggerMode = 0
SoftwareRandomTriggerRateHz = 0

[HardwareCoincidence]
# CH0/CH1의 threshold comparator 출력이 실제로 겹칠 때만 트리거합니다.
PairLogic = AND

[TriggerCalibration]
# Reset/DCOffset 적용 후 실제 software-trigger waveform으로 채널별 baseline을
# 측정하고, 연속 3회가 2 ADC 이내일 때만 self-trigger threshold를 기록합니다.
SettlingTimeMs = 3000
SettlingTimeoutMs = 15000
MeasurementEvents = 32
StabilityToleranceAdc = 2.0
StableMeasurements = 3

[Synchronization]
ClockSource = 0
RunSyncMode = 0

[SoftwareDSP]
# 오프라인 분석용 시간차이며 위 하드웨어 pair 논리와 별개입니다.
CoincidenceWindow = 20
# 현재 ROOT DSP schema 3은 polarity-corrected peak를 찾은 뒤
# [-20 ns, +40 ns) 고정 window를 signed 적분합니다.
# ShortCharge는 Charge와 같고, 아래 gate 및 선택적 PulseStartThresholdAdc는
# schema 1/2 재현과 provenance를 위한 legacy 설정입니다.
BaselineSamples = 163
ShortGate = 40
LongGate = 200

[DataQuality]
# accepted-trigger counter gap은 원인을 추정하지 않고 즉시 run failure로 처리합니다.
MaxLostEvents = 0
MaxLostFraction = 0.0

[Storage]
# 시작 시 확보할 여유 공간과 수집 중 안전 정지 문턱 (MiB)
MinimumFreeMiB = 1024
StopFreeMiB = 512

[Channel_0]
DCOffset = 6554
TriggerThresholdMv = 1.0

[Channel_1]
DCOffset = 6554
TriggerThresholdMv = 1.0

[Channel_2]
# 기록 전용 채널. 실제 입력에 맞춰 GUI에서 조정할 수 있습니다.
DCOffset = 6554

[Channel_3]
# 기록 전용 채널. 실제 입력에 맞춰 GUI에서 조정할 수 있습니다.
DCOffset = 6554
