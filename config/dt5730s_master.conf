# ==============================================================================
# CAEN DT5730S DAQ Configuration File (Universal for Inorganic Scintillators)
# Target: NaI(Tl), CsI(Tl), BGO 등 무기 섬광체 범용 세팅
# 
# [DT5730S Hardware Specifications 요약]
# 1. 샘플링 속도 (X축): 500 MS/s -> [ 1 Sample = 2 ns ]
# 2. ADC 분해능 (Y축 읽기): 14-bit -> [ 값 범위: 0 ~ 16383 ]
# 3. ADC 동적 범위      : 2 Vpp   -> [ 1 LSB = 2000 mV / 16384 = 약 0.122 mV ]
# 4. DAC 분해능 (Y축 조절): 16-bit -> [ 값 범위: 0 ~ 65535 ]
# ==============================================================================

[Connection]
Type=USB
Link=0
Node=0
BaseAddress=0
ExpectedModel=DT5730
# ExpectedSerial=12345

[Digitizer]
# -----------------------------------------------------------
# RecordLength: 1개 이벤트당 캡처할 총 파형 길이 (단위: Samples)
# - x730 표준 waveform firmware 제약: 10 Samples 단위로 설정합니다.
# - 2050 Samples * 2 ns = 4100 ns (4.1 us)
# - NaI(Tl) 파형을 넉넉하게 담으며, 붕괴 시간이 긴 CsI(Tl) 검출기에도 완벽히 대응합니다.
# -----------------------------------------------------------
RecordLength=2050

# -----------------------------------------------------------
# ChannelMask: 기록할 채널 비트마스크
# - CH0~CH3을 모두 기록: 00001111(2) = 15(10)
# -----------------------------------------------------------
# 기록할 채널의 10진수 비트마스크 (예: CH0~CH3 = 15)
ChannelMask=15

# SelfTriggerMask: 자체 트리거에 참여할 채널 비트마스크
# - CH0/CH1만 참여: 00000011(2) = 3(10)
# - CH2/CH3은 트리거에 관여하지 않고, CH0/CH1 트리거 때 함께 기록됩니다.
SelfTriggerMask=3

# -----------------------------------------------------------
# PostTrigger: 전체 파형 중 '트리거 발생 이후' 데이터의 비율 (%)
# - 80으로 설정 시(readback 80%): 총 2050 샘플 중 앞의 410 샘플(820 ns)은 펄스 이전(Pre)의 베이스라인으로,
#   뒤의 1640 샘플(3280 ns)은 펄스(Post)를 담아내는 데 사용됩니다.
# -----------------------------------------------------------
PostTrigger=80
InputRangeMv=2000
ADCBits=14

# -----------------------------------------------------------
# TriggerPolarity: 입력 신호 극성 (0 = Positive, 1 = Negative)
# - PMT Anode 직결 시 펄스가 밑으로 떨어지므로 반드시 '1 (Negative)' 사용.
# -----------------------------------------------------------
TriggerPolarity=1

# 자체 트리거 모드 활성화 (단일 보드)
ExtTriggerMode=0
SelfTriggerMode=1
# GUI의 Software Random 선택 시 이 두 값과 SelfTriggerMask가 자동 조정됩니다.
SoftwareRandomTriggerMode=0
SoftwareRandomTriggerRateHz=0
# ==============================================================================
#  하드웨어 self-trigger pair 논리
# ==============================================================================
[HardwareCoincidence]
# DT5730S x730 계열은 CH0/1, CH2/3, CH4/5, CH6/7의 고정 pair 구조입니다.
# PairLogic=AND: 선택한 pair의 두 채널 discriminator가 겹칠 때 트리거
# PairLogic=OR : 선택한 채널 중 하나의 discriminator만 활성화되어도 트리거
PairLogic=AND

[DCOffsetCalibration]
# TargetBaseline 모드에서 채널별 software-trigger 파형을 측정해 DAC를
# 자동 조정합니다. 수렴하지 않으면 physics acquisition을 시작하지 않습니다.
TargetTolerancePercent=0.5
MaxAdjustmentIterations=8
DacBusyTimeoutMs=1000
StepSettlingTimeMs=3000

[Synchronization]
# 다중 보드 동기화 (단일 보드이므로 0)
ClockSource=0
RunSyncMode=0

[SoftwareDSP]
# -----------------------------------------------------------
# Offline ROOT DSP 파라미터 (단위: Samples, 1 Sample = 2 ns)
# 현재 schema 3의 Charge는 polarity-corrected peak 기준
# [-20 ns, +40 ns) 고정 window를 signed 적분하고, ShortCharge도 같은 값입니다.
# -----------------------------------------------------------
# Offline/Online 분석 시 동시 계수로 묶어줄 소프트웨어 윈도우 (단위: ns)
CoincidenceWindow=20

# BaselineSamples: 트리거 발생 전, 0점(베이스라인)을 계산할 샘플 수
# - 150 Samples = 300 ns. (Pre-trigger로 확보된 820 ns 공간 내에서 300 ns 동안의 노이즈를 평균냅니다)
BaselineSamples=150

# ShortGate/LongGate 및 선택적 PulseStartThresholdAdc:
# - 현재 schema 3의 charge에는 사용하지 않습니다.
# - schema 1/2 파일 재현과 설정 provenance를 위한 legacy 값입니다.
ShortGate=150

LongGate=1500

[DataQuality]
MaxLostEvents=0
MaxLostFraction=0.0

[Storage]
# 시작 시 확보할 여유 공간과 수집 중 안전 정지 문턱 (MiB)
MinimumFreeMiB=1024
StopFreeMiB=512

[Channel_0]
# 음극성 펄스가 아래쪽 동적 범위를 넓게 쓰도록 실측 baseline을 90%에 맞춥니다.
DCOffsetMode=TargetBaseline
BaselineTargetPercent=90.0
TriggerThresholdMv=15.0

[Channel_1]
DCOffsetMode=TargetBaseline
BaselineTargetPercent=90.0
TriggerThresholdMv=15.0

[Channel_2]
DCOffsetMode=TargetBaseline
BaselineTargetPercent=90.0
[Channel_3]
DCOffsetMode=TargetBaseline
BaselineTargetPercent=90.0

[Channel_4]
DCOffset=6554
TriggerThreshold=14622

[Channel_5]
DCOffset=6554
TriggerThreshold=14622

[Channel_6]
DCOffset=6554
TriggerThreshold=14622

[Channel_7]
DCOffset=6554
TriggerThreshold=14622
