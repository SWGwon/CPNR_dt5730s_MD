# ==============================================================================
# CAEN DT5730S DAQ Configuration - External Clock & Trigger Synchronization
# 다중 보드 또는 외부 하드웨어와의 클록/트리거 연동 테스트용 설정입니다.
# ==============================================================================

[Digitizer]
RecordLength=1024
ChannelMask=1
# 외부 트리거 전용이므로 채널 discriminator는 트리거에 참여하지 않습니다.
# ChannelMask의 채널은 TRG-IN이 들어올 때 모두 함께 기록됩니다.
SelfTriggerMask=0
PostTrigger=70
InputRangeMv=2000
ADCBits=14
TriggerPolarity=1
# 자체 채널 트리거를 끄고, 전면 패널의 TRG-IN 포트로 들어오는 신호로만 기록합니다.
ExtTriggerMode=1
SelfTriggerMode=0

[HardwareCoincidence]
# SelfTriggerMode=0에서는 아래 pair 논리를 사용하지 않습니다.
PairLogic=OR

[Synchronization]
# 0: Internal, 1: External (전면 패널 CLK-IN 포트 사용)
ClockSource=1
# 0: Disabled, 1: Daisy Chain, 2: TRG-IN 활용 동기화
RunSyncMode=1

[SoftwareDSP]
BaselineSamples=150
ShortGate=150
LongGate=600

[Storage]
# 시작 시 확보할 여유 공간과 수집 중 안전 정지 문턱 (MiB)
MinimumFreeMiB=1024
StopFreeMiB=512

[Channel_0]
# 90% 베이스라인, 15mV 뎁스 적용
DCOffset=58981
TriggerThreshold=14622
